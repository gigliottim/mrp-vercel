server {
    listen 8080;
    server_name mimrp.com.ar www.mimrp.com.ar _;

    # Permitir a Certbot verificar el dominio por HTTP sin afectar el deploy
    location /.well-known/acme-challenge/ {
        root /app/public;
    }

    # Redireccionar el tráfico HTTP restante a HTTPS
    location / {
        return 301 https://mimrp.com.ar$request_uri;
    }
}

server {
    # Nginx de Bitnami usa usuarios sin privilegios, por eso usamos 8443 (que en docker-compose se mapea al 443)
    listen 8443 ssl;
    server_name mimrp.com.ar www.mimrp.com.ar;

    # Certificados mapeados desde el host (VPS)
    ssl_certificate /etc/letsencrypt/live/mimrp.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mimrp.com.ar/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /app/public;
    index index.php index.html;

    client_max_body_size 50M;

    # Security Headers recomendados
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include /opt/bitnami/nginx/conf/fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Forzar a PHP a reconocer que estamos tras HTTPS
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;


    location ~ /\.(?!well-known).* {
        deny all;
    }
}
