services:
  nginx:
    image: bitnami/nginx:latest
    container_name: lepp-nginx
    restart: always
    depends_on:
      - php-fpm
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./:/app
      - ./docker/nginx/mrp.conf:/opt/bitnami/nginx/conf/server_blocks/mrp.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./docker/logs/nginx:/opt/bitnami/nginx/logs
    networks:
      - lepp-net

  php-fpm:
    image: bitnami/php-fpm:latest
    container_name: lepp-php-fpm
    restart: always
    working_dir: /app
    volumes:
      - ./:/app
      - ./docker/logs/php-fpm:/opt/bitnami/php/var/log
    networks:
      - lepp-net

  postgresql:
    image: bitnami/postgresql:latest
    container_name: lepp-postgresql
    restart: always
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/bitnami/postgresql
      - ./docker/logs/postgresql:/opt/bitnami/postgresql/logs
    networks:
      - lepp-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lepp-pgadmin
    restart: always
    depends_on:
      - postgresql
    env_file:
      - .env.docker
    environment:
      - PGADMIN_CONFIG_LOG_FILE=/var/log/pgadmin/pgadmin4.log
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/logs/pgadmin:/var/log/pgadmin
    networks:
      - lepp-net

networks:
  lepp-net:
    driver: bridge

volumes:
  postgresql_data:
  pgadmin_data:
